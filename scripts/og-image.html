<!doctype html>
<!--
  Source for og-image.png (1200×630). Not shipped — see scripts/og-image.sh.
  Gelasio is metric-compatible with Georgia, the site's display face.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200" />
    <meta name="description" content="Source for kevintcoughlin.com's og-image.png." />
    <title>og-image</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Gelasio:ital@0;1&family=Inter:wght@400;500&family=JetBrains+Mono&display=block"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        box-sizing: border-box;
        padding: 72px 84px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: #edf0e9;
        background:
          radial-gradient(circle at 82% 12%, rgba(215, 239, 114, 0.14), transparent 420px),
          radial-gradient(circle at 8% 110%, rgba(244, 162, 97, 0.1), transparent 380px), #14211d;
        font-family: Inter, sans-serif;
      }
      .eyebrow {
        color: #d7ef72;
        font-family: 'JetBrains Mono', monospace;
        font-size: 20px;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }
      h1 {
        margin: 26px 0 0;
        max-width: 960px;
        font-family: Gelasio, Georgia, serif;
        font-size: 104px;
        font-weight: 400;
        line-height: 0.92;
        letter-spacing: -0.055em;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        align-items: end;
        padding-top: 26px;
        border-top: 1px solid rgba(237, 240, 233, 0.18);
      }
      .name {
        font-family: Gelasio, Georgia, serif;
        font-size: 40px;
        letter-spacing: -0.03em;
      }
      .name span {
        color: #d7ef72;
      }
      .url {
        padding-left: 18px;
        border-left: 2px solid #f4a261;
        color: #a8b4aa;
        font-family: 'JetBrains Mono', monospace;
        font-size: 22px;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="eyebrow">Programmer · builder · Redmond, WA</div>
      <h1>Making useful things for curious people.</h1>
    </div>
    <div class="foot">
      <div class="name">Kevin Coughlin<span>.</span></div>
      <div class="url">kevintcoughlin.com</div>
    </div>
  </body>
</html>
