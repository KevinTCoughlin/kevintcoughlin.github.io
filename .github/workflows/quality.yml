name: Quality

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    # Weekly link-rot check + devcontainer smoke test (Mondays 09:00 UTC)
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Stage site assets
        run: bash scripts/stage-site.sh _site

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  links:
    name: Link check (lychee)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LYCHEE_ARGS: >-
        --cache --max-cache-age 1d
        --cache-exclude-status '503'
        --no-progress
        --root-dir ${{ github.workspace }}
        --exclude '^http://localhost'
        --accept 200,206,301,302,403,429
        --remap 'https://kevintcoughlin.com/blog/ file://${{ github.workspace }}/blog/'
        'index.html' 'README.md' 'sitemap.xml'
    steps:
      - uses: actions/checkout@v7

      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      # sitemap.xml uses absolute blog URLs. A new post 404s on the live site
      # until this commit is deployed, so check /blog/ against the files here.
      #
      # lychee 0.24 retries transport errors and HTTP 429, not a rejected 503.
      # https://bauhaus.cascadiacollections.workers.dev/api/feed.atom returned
      # one 503 on 52c82be and 200 on the next probes, so skip caching that
      # status and run the check once more before failing the job.
      - name: Run lychee
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: ${{ env.LYCHEE_ARGS }}
          fail: true

      - name: Wait before lychee retry
        if: steps.lychee.outcome == 'failure'
        run: sleep 15

      - name: Retry lychee
        if: steps.lychee.outcome == 'failure'
        uses: lycheeverse/lychee-action@v2
        with:
          args: ${{ env.LYCHEE_ARGS }}
          fail: true

  devcontainer:
    name: Devcontainer smoke test
    # Run on weekly schedule + manual dispatch only. Catches devcontainer
    # rot (broken base image, missing tool, postCreate regression) without
    # paying the cost on every PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build devcontainer and validate
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            set -e
            node --version
            bun --version
            bun install --frozen-lockfile
            bun run validate
            bash scripts/stage-site.sh _site
            test -f _site/index.html
